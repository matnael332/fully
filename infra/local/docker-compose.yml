name: work-continuity-local

services:
  postgres:
    # pgvector/pgvector:pg17 is PostgreSQL 17 with the vector extension already built in. The plain
    # postgres:17-alpine image ships no vector extension files, so CREATE EXTENSION would fail.
    # This is a local-image change only: the production target remains Azure Database for PostgreSQL
    # Flexible Server, where pgvector is an allow-listed extension rather than a bundled binary.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-workcontinuity_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only on first initialization of an empty data directory.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - local

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    networks:
      - local

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    pull_policy: always
    depends_on:
      - mssql
    environment:
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      ACCEPT_EULA: ${ACCEPT_EULA}
      EMULATOR_HTTP_PORT: ${EMULATOR_HTTP_PORT:-5300}
      SQL_WAIT_INTERVAL: 15
    volumes:
      - ./servicebus/config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "${SERVICEBUS_AMQP_PORT:-5672}:5672"
      - "${EMULATOR_HTTP_PORT:-5300}:${EMULATOR_HTTP_PORT:-5300}"
    networks:
      local:
        aliases:
          - servicebus-emulator

  # Runtime-role bootstrap: the same entry point the Azure bootstrap job runs. On a fresh volume the
  # init script has already created the role, so locally this exercises the update path; in Azure it
  # creates the role. It runs before the migrator, as in Azure, so the migration's guarded grants find
  # the role. It proves the login before it exits, and it never prints the password.
  db-bootstrap:
    build:
      context: ../..
      dockerfile: src/App.Worker/Dockerfile
    command: ["--bootstrap-runtime-role"]
    environment:
      ConnectionStrings__PostgresAdmin: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Postgres__RuntimeRoleName: ${POSTGRES_APP_USER:-workcontinuity_app}
      Postgres__RuntimeRolePassword: ${POSTGRES_APP_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - local

  # Schema migration is a one-shot service that must finish before the applications start. Running it
  # here rather than inside Web and Worker keeps two instances from racing to migrate the same schema,
  # and mirrors how a deployment applies migrations as an explicit step.
  db-migrator:
    build:
      context: ../..
      dockerfile: src/App.Worker/Dockerfile
    command: ["--migrate-database"]
    environment:
      # The administrative connection: only the bootstrap and migration services receive it.
      ConnectionStrings__PostgresAdmin: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - local

  web:
    build:
      context: ../..
      dockerfile: src/App.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # The emulator's fixed, published development key; readiness opens a real send link with it.
      ServiceBus__ConnectionString: "Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      # The non-owner runtime role, so row-level security applies to every query.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_APP_USER:-workcontinuity_app};Password=${POSTGRES_APP_PASSWORD}"
    ports:
      - "${WEB_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
      servicebus-emulator:
        condition: service_started
    networks:
      - local

  worker:
    build:
      context: ../..
      dockerfile: src/App.Worker/Dockerfile
    environment:
      # The emulator's fixed, published development key; the Worker peeks a queue with it.
      ServiceBus__ConnectionString: "Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_APP_USER:-workcontinuity_app};Password=${POSTGRES_APP_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
      servicebus-emulator:
        condition: service_started
    networks:
      - local

networks:
  local:

volumes:
  postgres-data:
