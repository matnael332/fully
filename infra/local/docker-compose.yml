name: work-continuity-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - local

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    networks:
      - local

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    pull_policy: always
    depends_on:
      - mssql
    environment:
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      ACCEPT_EULA: ${ACCEPT_EULA}
      EMULATOR_HTTP_PORT: ${EMULATOR_HTTP_PORT:-5300}
      SQL_WAIT_INTERVAL: 15
    volumes:
      - ./servicebus/config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "${SERVICEBUS_AMQP_PORT:-5672}:5672"
      - "${EMULATOR_HTTP_PORT:-5300}:${EMULATOR_HTTP_PORT:-5300}"
    networks:
      local:
        aliases:
          - servicebus-emulator

  web:
    build:
      context: ../..
      dockerfile: src/App.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Dependencies__Postgres__Host: postgres
      Dependencies__Postgres__Port: "5432"
      Dependencies__ServiceBusEmulator__HealthUrl: http://servicebus-emulator:${EMULATOR_HTTP_PORT:-5300}/health
    ports:
      - "${WEB_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      servicebus-emulator:
        condition: service_started
    networks:
      - local

  worker:
    build:
      context: ../..
      dockerfile: src/App.Worker/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SERVICEBUS_HEALTH_URL: http://servicebus-emulator:${EMULATOR_HTTP_PORT:-5300}/health
    depends_on:
      postgres:
        condition: service_healthy
      servicebus-emulator:
        condition: service_started
    networks:
      - local

networks:
  local:

volumes:
  postgres-data:
